spring.application.name=sneakershop
# PostgreSQL Connection Configuration
spring.datasource.url=${DATABASE_URL_LOCAL:${DATABASE_URL}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Disable Hibernate usage of JDBC metadata
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
# Database initialization should typically be performed outside of Spring lifecycle
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
server.port=${PORT:8080}
sneakershop.local-demo.enabled=${SNEAKERSHOP_LOCAL_DEMO:false}

checkout.stripe.secret-key=${STRIPE_SECRET_KEY:}
checkout.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
checkout.frontend-url=${STRIPE_CHECKOUT_FRONTEND_URL:http://localhost:3000}
checkout.confirmation.api-key=${RESEND_API_KEY:}
checkout.confirmation.api-url=${CHECKOUT_CONFIRMATION_API_URL:https://api.resend.com/emails}
checkout.confirmation.from=${CHECKOUT_CONFIRMATION_FROM:SneakerShop <onboarding@resend.dev>}
checkout.confirmation.test-recipient=${CHECKOUT_CONFIRMATION_TEST_RECIPIENT:}
# JPA & Hibernate Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jackson.default-property-inclusion=non_null
# Max file size for a single upload (10MB)
spring.servlet.multipart.max-file-size=10MB
# Max total request size (50MB, useful when uploading multiple files)
spring.servlet.multipart.max-request-size=50MB

aws.access-key=${aws.access-key}
aws.secret-key=${aws.secret-key}
aws.region=${aws.region}
aws.s3.bucket-name=${aws.s3.bucket-name}
